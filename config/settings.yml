lexicon:
  lexicon_push_notifications_enabled:
    default: false
  lexicon_email_deep_linking_enabled:
    default: false
    validator: "LexiconEnableDeepLinkingValidator"
  lexicon_app_scheme:
    client: true
    default: ""
    type: text
    validator: "LexiconAppSchemeValidator"
  lexicon_image_dimensions_enabled:
    default: true
    client: false
    description: "Enable server-side image dimension caching for Lexicon app"
  lexicon_projects_allowed_group:
    default: ""
    client: false
    type: group
    description: "Group allowed to create Lexicon projects (categories). If empty, only users allowed by Guardian can create."
